name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Dogfood: the route tests under .github/simulci/tests, run with the bundle that was just built.
      - run: node packages/cli/dist/index.js test
      - run: pnpm coverage
      - id: upload
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/

  fallow:
    # Code health (fallow.tools, policy in .fallowrc.jsonc): no unused files, exports or dependencies, no duplicated
    # code, the licence boundaries between packages/, apps/ and ee/ hold, and a pull request adds no complex,
    # duplicated or unused code compared with its base.
    name: Code health
    runs-on: ubuntu-latest
    env:
      FALLOW_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit compares the pull request with its base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec fallow dead-code
      - run: pnpm exec fallow dupes
      - run: pnpm exec fallow architecture
      - id: audit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec fallow audit --base "origin/$BASE_REF"

  workflows:
    # This repository's own workflows, checked by flowpact (built on the same @ciatlas/core).
    name: Workflows (flowpact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ciatlas/flowpact@d342e2e0fa2137bf332df2adde48e27639b820fe # v0.24.0
        with:
          mode: lint
          fail-on: warning

  zizmor:
    # Workflow security (zizmor.sh): template injection, credentials left in the checkout, cache poisoning, unpinned or
    # impostor actions and more. Findings fail the job and annotate the pull request.
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: 1.30.1
          advanced-security: false
          annotations: true

  schemas:
    # The JSON schemas under schemas/ are generated from the engine (pnpm schemas) and committed, so the $id URLs
    # GitHub Pages serves are always what the release defines.
    name: Schemas up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas
      - run: git diff --exit-code -- schemas

  ci-passed:
    # The only required status check: add new jobs to `needs` instead of changing the branch rules.
    name: CI passed
    if: always()
    needs: [test, fallow, workflows, zizmor, schemas]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
