name: Package
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test --workspace apps/${{ inputs.name }}
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: npm run lint --workspace apps/${{ inputs.name }}
