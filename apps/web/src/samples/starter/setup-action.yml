name: Setup
description: Node with the dependencies cached
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - id: cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: deps-${{ hashFiles('package-lock.json') }}
    - run: npm ci
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
