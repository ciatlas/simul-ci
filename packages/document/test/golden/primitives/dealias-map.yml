on: push
env:
  RUNNER: &runner ubuntu-latest
jobs:
  build: &job
    runs-on: *runner
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          make
          make check
  test:
    runs-on: *runner
    steps:
      - *checkout
      - run: make test
  again:
    runs-on: *runner
    steps:
      -
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          make
          make check
