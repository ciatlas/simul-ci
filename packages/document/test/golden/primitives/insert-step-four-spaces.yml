name: "Four spaces"
on:
    push:
        branches:
            - main
            - "release/**"
jobs:
    build:
        runs-on: ubuntu-latest
        needs:
            - lint
        if: ${{ github.event_name == 'push' }}
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4  # pinned

            -   name: Install
                run: npm ci

            -   run: make

    lint:
        runs-on: ubuntu-latest
        steps:
            -   run: make lint
