on: push
env:
  RUNNER: ubuntu-latest
jobs:
  build: &job
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          make
          make check
  test:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - run: make test
  again: *job
