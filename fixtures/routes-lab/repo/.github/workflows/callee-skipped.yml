# Helper for case 9: a reusable workflow whose jobs are all skipped; its output comes from a skipped job.
name: callee-skipped
on:
  workflow_call:
    outputs:
      o:
        description: output of the skipped job x
        value: ${{ jobs.x.outputs.o }}
jobs:
  x:
    if: false
    runs-on: ubuntu-latest
    outputs:
      o: hello
    steps:
      - name: never
        run: 'echo "probe: x=ran"'
  y:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: never
        run: 'echo "probe: y=ran"'
