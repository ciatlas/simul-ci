# skip-ci.yml
# Commit-message skip markers: what they are, where they are read, which
# events honour them. Every `quote` is verbatim (fetched 2026-10-17).

sources:
  skip: &skip https://docs.github.com/en/actions/how-tos/manage-workflow-runs/skip-workflow-runs
  syntax: &syntax https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

markers:
  - rule: "the five bracket markers"
    source: *skip
    quote: |-
      Workflows that would otherwise be triggered using `on: push` or `on: pull_request` won't be triggered if you add any of the following strings to the commit message in a push, or the HEAD commit of a pull request:
    quote_bullets:
      - "[skip ci]"
      - "[ci skip]"
      - "[no ci]"
      - "[skip actions]"
      - "[actions skip]"
    strings: ["[skip ci]", "[ci skip]", "[no ci]", "[skip actions]", "[actions skip]"]
    cases:
      - { message: "fix typo [skip ci]", skipped: true }
      - { message: "[ci skip] fix typo", skipped: true }
      - { message: "fix typo\n\n[no ci]", skipped: true }
      - { message: "wip [skip actions]", skipped: true }
      - { message: "wip [actions skip]", skipped: true }
      - { message: "fix typo", skipped: false }
      - { message: "skip ci", skipped: false, derived: true, note: "brackets are part of the marker" }
      - { message: "[skip  ci]", skipped: false, derived: true, note: "UNVERIFIED: docs do not define whitespace tolerance; treat as exact substring" }
      - { message: "[SKIP CI]", skipped: UNVERIFIED, derived: true, note: "docs do not say whether matching is case-insensitive" }
  - rule: "the skip-checks trailer (must be a trailer: preceded by two empty lines, last trailer)"
    source: *skip
    quote: |-
      Alternatively, you can add a `skip-checks` trailer to your commit message. The trailers section should be included at the end of your commit message and be preceded by two empty lines. If you already have other trailers in your commit message, `skip-checks` should be last. You can use either of the following:
    quote_bullets:
      - "skip-checks:true"
      - "skip-checks: true"
    strings: ["skip-checks:true", "skip-checks: true"]
    cases:
      - { message: "fix typo\n\n\nskip-checks: true", skipped: true }
      - { message: "fix typo\n\n\nskip-checks:true", skipped: true }
      - { message: "fix typo\n\n\nSigned-off-by: a@b.c\nskip-checks: true", skipped: true }
      - { message: "fix typo\n\n\nskip-checks: true\nSigned-off-by: a@b.c", skipped: UNVERIFIED, note: "docs say skip-checks 'should be last'; they do not say what happens if it is not" }
      - { message: "skip-checks: true fix typo", skipped: UNVERIFIED, note: "inline, not a trailer; docs are silent" }
    quote_git_cleanup: |-
      By default, Git automatically removes consecutive newlines. To leave the commit message exactly as you entered it, use the `--cleanup=verbatim` option on your commit. For more information, see `--cleanup=<mode>` in the Git documentation.

where_read:
  - rule: "push: the commit message 'in a push'; pull_request: the PR's HEAD commit"
    source: *skip
    quote: |-
      Workflows that would otherwise be triggered using `on: push` or `on: pull_request` won't be triggered if you add any of the following strings to the commit message in a push, or the HEAD commit of a pull request:
    note: |-
      For push the docs say "the commit message in a push" without specifying WHICH commit when several are pushed. The sentence below ("the commit that contains the skip instructions") implies the head commit of the push. UNVERIFIED whether a marker in a non-head commit of a multi-commit push skips the run; the simulator should read only the head commit.
    cases:
      - { event: push, head_commit_message: "x [skip ci]", skipped: true }
      - { event: push, head_commit_message: "x", earlier_commit_message: "y [skip ci]", skipped: false, derived: true, note: "UNVERIFIED; see note" }
      - { event: pull_request, pr_head_commit_message: "x [skip ci]", skipped: true }
      - { event: pull_request, pr_head_commit_message: "x", pr_title: "[skip ci] x", skipped: false, derived: true, note: "only the HEAD commit message is read, not the PR title/body" }
  - rule: "the skip applies only to the run(s) the marked commit would have triggered"
    source: *skip
    quote: |-
      Skip instructions only apply to the workflow run(s) that would be triggered by the commit that contains the skip instructions. You can also disable a workflow from running. For more information, see Disabling and enabling a workflow.

events_honouring:
  - rule: "only push and pull_request honour skip markers"
    source: *skip
    quote: |-
      You can skip workflow runs triggered by the `push` and `pull_request` events by including a command in your commit message.
    quote_2: |-
      Skip instructions only apply to the `push` and `pull_request` events. For example, adding `[skip ci]` to a commit message won't stop a workflow that's triggered `on: pull_request_target` from running.
    honoured: [push, pull_request]
    not_honoured: [pull_request_target, workflow_dispatch, schedule, merge_group, release, create, workflow_run, repository_dispatch, issue_comment, issues, pull_request_review, pull_request_review_comment, deployment, status, check_run, check_suite, every_other_event]
    cases:
      - { event: push, head_commit_message: "x [skip ci]", skipped: true }
      - { event: pull_request, pr_head_commit_message: "x [skip ci]", skipped: true }
      - { event: pull_request_target, pr_head_commit_message: "x [skip ci]", skipped: false }
      - { event: workflow_dispatch, head_commit_message: "x [skip ci]", skipped: false, derived: true }
      - { event: schedule, head_commit_message: "x [skip ci]", skipped: false, derived: true }
      - { event: merge_group, head_commit_message: "x [skip ci]", skipped: false, derived: true }
      - { event: release, head_commit_message: "x [skip ci]", skipped: false, derived: true }
      - { event: workflow_run, head_commit_message: "x [skip ci]", skipped: false, derived: true }
  - rule: "workflow_dispatch runs regardless of a skip marker on the ref's head commit"
    source: *skip
    quote: |-
      Skip instructions only apply to the `push` and `pull_request` events. For example, adding `[skip ci]` to a commit message won't stop a workflow that's triggered `on: pull_request_target` from running.
    note: |-
      The skip page never mentions `workflow_dispatch` by name. "Can be used to run anyway" is an inference from "Skip instructions only apply to the `push` and `pull_request` events." Mark as derived in tests.
    cases:
      - { event: workflow_dispatch, ref: refs/heads/main, head_commit_message: "x [skip ci]", runs: true, derived: true }

consequences:
  - rule: "skipped runs leave required checks Pending and block merge"
    source: *skip
    quote: |-
      If a workflow is skipped due to path filtering, branch filtering or a commit message (see below), then checks associated with that workflow will remain in a "Pending" state. A pull request that requires those checks to be successful will be blocked from merging.
    quote_2: |-
      You won't be able to merge the pull request if your repository is configured to require specific checks to pass first. To allow the pull request to be merged you can push a new commit to the pull request without the skip instruction in the commit message.
    cases:
      - { event: pull_request, pr_head_commit_message: "x [skip ci]", required_check: true, check_state: pending, mergeable: false }
