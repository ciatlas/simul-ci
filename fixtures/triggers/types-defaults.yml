# types-defaults.yml
# For every GitHub Actions event that has activity types: the full list of
# types and the set that applies when `on.<event>.types` is omitted.
# Every `quote` is verbatim from the cited page (fetched 2026-10-17).
# Events with no activity types are listed at the end for completeness.

sources:
  events: &events https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  syntax: &syntax https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

general_rules:
  - rule: "`types` narrows activity; when the event has one type the keyword is unnecessary"
    source: *syntax
    quote: |-
      Use `on.<event_name>.types` to define the type of activity that will trigger a workflow run. Most GitHub events are triggered by more than one type of activity. For example, the `label` is triggered when a label is `created`, `edited`, or `deleted`. The `types` keyword enables you to narrow down activity that causes the workflow to run. When only one activity type triggers a webhook event, the `types` keyword is unnecessary.
  - rule: "multiple listed types are OR-ed; simultaneous activity types produce one run each"
    source: *syntax
    quote: |-
      If you specify multiple activity types, only one of those event activity types needs to occur to trigger your workflow. If multiple triggering event activity types for your workflow occur at the same time, multiple workflow runs will be triggered. For example, the following workflow triggers when an issue is opened or labeled. If an issue with two labels is opened, three workflow runs will start: one for the issue opened event and two for the two issue labeled events.
  - rule: "multiple events are OR-ed"
    source: *syntax
    quote: |-
      If you specify multiple events, only one of those events needs to occur to trigger your workflow. If multiple triggering events for your workflow occur at the same time, multiple workflow runs will be triggered.
  - rule: "the standard 'default is all types' sentence that the events page repeats per event"
    source: *events
    quote: |-
      By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword.

# table: event -> { types, default, default_is_all, quote }
table:
  branch_protection_rule:
    types: [created, edited, deleted]
    default: [created, edited, deleted]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

  check_run:
    types: [created, rerequested, completed, requested_action]
    default: [created, rerequested, completed, requested_action]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "recursion guard: no run when the check suite was created by Actions"
        quote: |-
          To prevent recursive workflows, this event does not trigger workflows if the check run's check suite was created by GitHub Actions or if the check suite's head SHA is associated with GitHub Actions.

  check_suite:
    types: [completed]
    default: [completed]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. Although only the `completed` activity type is supported, specifying the activity type will keep your workflow specific if more activity types are added in the future. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "recursion guard"
        quote: |-
          To prevent recursive workflows, this event does not trigger workflows if the check suite was created by GitHub Actions or if the check suite's head SHA is associated with GitHub Actions.

  discussion:
    types: [created, edited, deleted, transferred, pinned, unpinned, labeled, unlabeled, locked, unlocked, category_changed, answered, unanswered]
    default: [created, edited, deleted, transferred, pinned, unpinned, labeled, unlabeled, locked, unlocked, category_changed, answered, unanswered]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

  discussion_comment:
    types: [created, edited, deleted]
    default: [created, edited, deleted]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

  issue_comment:
    types: [created, edited, deleted]
    default: [created, edited, deleted]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "event description"
        quote: |-
          Runs your workflow when an issue or pull request comment is created, edited, or deleted. For information about the issue comment APIs, see Issues in the GraphQL API documentation or Webhook events and payloads in the REST API documentation.
      - rule: "fires for comments on both issues and PRs; discriminate with github.event.issue.pull_request"
        quote: |-
          The `issue_comment` event occurs for comments on both issues and pull requests. You can use the `github.event.issue.pull_request` property in a conditional to take different action depending on whether the triggering object was an issue or pull request.

  issues:
    types: [opened, edited, deleted, transferred, pinned, unpinned, closed, reopened, assigned, unassigned, labeled, unlabeled, locked, unlocked, milestoned, demilestoned, typed, untyped, field_added, field_removed]
    default: [opened, edited, deleted, transferred, pinned, unpinned, closed, reopened, assigned, unassigned, labeled, unlabeled, locked, unlocked, milestoned, demilestoned, typed, untyped, field_added, field_removed]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "field_added also fires on update of an existing field value"
        quote: |-
          You can also run a workflow when an issue field value is set, changed, or cleared. The `field_added` activity type fires both when a field value is initially set and when an existing value is updated. The `field_removed` activity type fires when a field value is cleared.

  label:
    types: [created, edited, deleted]
    default: [created, edited, deleted]
    default_is_all: true
    source: *syntax
    quote: |-
      For example, the `issue_comment` event has the `created`, `edited`, and `deleted` activity types. If your workflow triggers on the `label` event, it will run whenever a label is created, edited, or deleted. If you specify the `created` activity type for the `label` event, your workflow will run when a label is created but not when a label is edited or deleted.

  merge_group:
    types: [checks_requested]
    default: [checks_requested]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. Although only the `checks_requested` activity type is supported, specifying the activity type will keep your workflow specific if more activity types are added in the future. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "merge_group is distinct from pull_request and push; required checks need it listed"
        quote: |-
          If your repository uses GitHub Actions to perform required checks on pull requests in your repository, you need to update the workflows to include the `merge_group` event as an additional trigger. Otherwise, status checks will not be triggered when you add a pull request to a merge queue. The merge will fail as the required status check will not be reported. The `merge_group` event is separate from the `pull_request` and `push` events.

  milestone:
    types: [created, closed, opened, edited, deleted]
    default: [created, closed, opened, edited, deleted]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

  pull_request:
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, closed, reopened, synchronize, converted_to_draft, locked, unlocked, enqueued, dequeued, milestoned, demilestoned, ready_for_review, review_requested, review_request_removed, auto_merge_enabled, auto_merge_disabled]
    default: [opened, synchronize, reopened]
    default_is_all: false
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, a workflow only runs when a `pull_request` event's activity type is `opened`, `synchronize`, or `reopened`. To trigger workflows by different activity types, use the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "no run while the PR has a merge conflict (pull_request_target still runs)"
        quote: |-
          Workflows will not run on `pull_request` activity if the pull request has a merge conflict. The merge conflict must be resolved first. Conversely, workflows with the `pull_request_target` event will run even if the pull request has a merge conflict. Before using the `pull_request_target` trigger, you should be aware of the security risks. For more information, see `pull_request_target`.
      - rule: "GITHUB_TOKEN-created PRs: opened/synchronize/reopened runs need approval; other GITHUB_TOKEN-triggered events create no runs"
        quote: |-
          When a pull request is created or updated by a workflow using `GITHUB_TOKEN`, `pull_request` events with the `opened`, `synchronize`, or `reopened` activity types create workflow runs that require approval. A user with write access to the repository can approve these runs from the pull request page. With the exception of `workflow_dispatch` and `repository_dispatch`, other `GITHUB_TOKEN`-triggered events do not create workflow runs at all.
      - rule: "closed covers merged; discriminate with github.event.pull_request.merged"
        quote: |-
          When a pull request merges, the pull request is automatically closed. To run a workflow when a pull request merges, use the `pull_request` `closed` event type along with a conditional that checks the `merged` value of the event. For example, the following workflow will run whenever a pull request closes. The `if_merged` job will only run if the pull request was also merged.

  pull_request_review:
    types: [submitted, edited, dismissed]
    default: [submitted, edited, dismissed]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

  pull_request_review_comment:
    types: [created, edited, deleted]
    default: [created, edited, deleted]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

  pull_request_target:
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, closed, reopened, synchronize, converted_to_draft, locked, unlocked, enqueued, dequeued, milestoned, demilestoned, ready_for_review, review_requested, review_request_removed, auto_merge_enabled, auto_merge_disabled]
    default: [opened, synchronize, reopened]
    default_is_all: false
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, a workflow only runs when a `pull_request_target` event's activity type is `opened`, `synchronize`, or `reopened`. To trigger workflows by different activity types, use the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "webhook payload name is `pull_request` (the events-page table lists the payload as pull_request for this event)"
        quote: |-
          Runs your workflow when activity on a pull request in the workflow's repository occurs. For example, if no activity types are specified, the workflow runs when a pull request is opened or reopened or when the head branch of the pull request is updated.
      - rule: "SHA-looking branch names may not trigger it"
        quote: |-
          To ensure repository security, branches with names that match certain patterns (such as those which look similar to SHAs) may not trigger workflows with the `pull_request_target` event.

  registry_package:
    types: [published, updated]
    default: [published, updated]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "multi-arch images fire once per manifest"
        quote: |-
          When pushing multi-architecture container images, this event occurs once per manifest, so you might observe your workflow triggering multiple times.

  release:
    types: [published, unpublished, created, edited, deleted, prereleased, released]
    default: [published, unpublished, created, edited, deleted, prereleased, released]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.
    extra_rules:
      - rule: "draft releases do not fire created/edited/deleted"
        quote: |-
          Workflows are not triggered for the `created`, `edited`, or `deleted` activity types for draft releases. When you create your release through the GitHub UI, your release may automatically be saved as a draft.
      - rule: "prereleased does not fire for pre-releases published from drafts; published does"
        quote: |-
          The `prereleased` type will not trigger for pre-releases published from draft releases, but the `published` type will trigger. If you want a workflow to run when stable and pre-releases publish, subscribe to `published` instead of `released` and `prereleased`.

  repository_dispatch:
    types: CUSTOM   # user-defined event_type strings sent in the API request
    default: ALL    # any event_type
    default_is_all: true
    source: *events
    quote: |-
      When you make a request to create a `repository_dispatch` event, you must specify an `event_type` to describe the activity type. By default, all `repository_dispatch` activity types trigger a workflow to run. You can use the `types` keyword to limit your workflow to run when a specific `event_type` value is sent in the `repository_dispatch` webhook payload.
    extra_rules:
      - rule: "event_type length limit"
        quote: |-
          The `event_type` value is limited to 100 characters.
      - rule: "client_payload limits"
        quote: |-
          The maximum number of top-level properties in `client_payload` is 10.

  watch:
    types: [started]
    default: [started]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. Although only the `started` activity type is supported, specifying the activity type will keep your workflow specific if more activity types are added in the future. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

  workflow_run:
    types: [completed, requested, in_progress]
    default: [completed, requested, in_progress]
    default_is_all: true
    source: *events
    quote: |-
      More than one activity type triggers this event. The `requested` activity type does not occur when a workflow is re-run. For information about each activity type, see Webhook events and payloads. By default, all activity types trigger workflows that run on this event. You can limit your workflow runs to specific activity types using the `types` keyword. For more information, see Workflow syntax for GitHub Actions.

# Events whose events-page table says "Activity types: Not applicable" (or has no
# types column value). `types:` is meaningless for these; the simulator should
# treat any `types:` under them as a lint warning (UNVERIFIED: the docs do not
# say what GitHub does with a `types:` key on a type-less event).
no_activity_types:
  source: *events
  events:
    - create
    - delete
    - deployment
    - deployment_status
    - fork
    - gollum
    - image_version      # filters are `names` and `versions` (glob), not `types`
    - page_build
    - public
    - push
    - schedule
    - status
    - workflow_call
    - workflow_dispatch
  extra_rules:
    - rule: "deployment_status inactive does not trigger"
      quote: |-
        When a deployment status's state is set to `inactive`, a workflow run will not be triggered.
    - rule: "create: no event when more than three tags are created at once"
      quote: |-
        An event will not be created when you create more than three tags at once.
    - rule: "delete: no event when more than three tags are deleted at once"
      quote: |-
        An event will not be created when you delete more than three tags at once.
    - rule: "push: bulk limits"
      quote: |-
        Events will not be created if more than 5,000 branches are pushed at once. Events will not be created for tags when more than three tags are pushed at once.
    - rule: "image_version filters by names/versions globs"
      quote: |-
        This event supports glob patterns for both image names and versions. The example below triggers when a new image version matches any of the specified name and version combinations. For example, `["MyNewImage", 1.0.0]`, `["MyNewImage", 2.53.0]`, `["MyOtherImage", 1.0.0]`, and `["MyOtherImage", 2.0.0]`.
